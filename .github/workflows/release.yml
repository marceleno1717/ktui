name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write   # to create GitHub Release + upload assets

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # 1. Run tests before doing anything
  # ─────────────────────────────────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python test_interaction.py
      - run: python test_full_suite.py

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. Build a self-contained binary on each platform
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: Build — linux-x64
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies + PyInstaller
        run: |
          pip install -e .
          pip install pyinstaller

      - name: Build binary
        run: |
          pyinstaller ktui.spec --distpath dist --workpath build/pyinstaller --clean -y

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ktui-linux-x64
          path: dist/ktui
          if-no-files-found: error
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────────────────
  # 3. Create GitHub Release and attach all binaries
  # ─────────────────────────────────────────────────────────────────────────────
  github-release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Rename binaries for release assets
        run: |
          mkdir -p release
          cp artifacts/ktui-linux-x64/ktui release/ktui-linux-x64
          chmod +x release/ktui-linux-x64

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*

  # ─────────────────────────────────────────────────────────────────────────────
  # 4. Publish to npm
  # ─────────────────────────────────────────────────────────────────────────────
  npm-publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # required for npm OIDC publishing

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Stage binaries into npm platform packages
        run: |
          VERSION="${GITHUB_REF_NAME#v}"   # strip leading "v" from tag

          stage() {
            local target="$1" bin="$2"
            local pkg_dir="npm-package/npm/ktui-${target}"
            mkdir -p "${pkg_dir}/bin"
            cp "artifacts/ktui-${target}/${bin}" "${pkg_dir}/bin/${bin}"
            chmod +x "${pkg_dir}/bin/${bin}" 2>/dev/null || true
            # Stamp version into the sub-package
            node -e "
              const fs = require('fs');
              const p = '${pkg_dir}/package.json';
              const j = JSON.parse(fs.readFileSync(p));
              j.version = '${VERSION}';
              fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
            "
          }

          stage linux-x64 ktui

          # Stamp version into main package and optionalDependencies
          node -e "
            const fs = require('fs');
            const p = 'npm-package/package.json';
            const j = JSON.parse(fs.readFileSync(p));
            j.version = '${VERSION}';
            for (const k of Object.keys(j.optionalDependencies)) {
              j.optionalDependencies[k] = '${VERSION}';
            }
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
          "

      - name: Publish platform packages
        run: |
          for pkg in npm-package/npm/ktui-*/; do
            echo "Publishing $pkg …"
            cd "$pkg"
            npm publish --provenance --access public
            cd "$GITHUB_WORKSPACE"
          done

      - name: Publish main package
        run: |
          cd npm-package
          chmod +x bin/ktui.js
          npm publish --provenance --access public

  # ─────────────────────────────────────────────────────────────────────────────
  # 5. Publish to PyPI
  # ─────────────────────────────────────────────────────────────────────────────
  pypi-publish:
    name: Publish to PyPI
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # required for OIDC PyPI publishing
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tool
        run: pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
