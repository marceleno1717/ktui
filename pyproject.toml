[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ktui"
version = "0.1.0"
description = "ktui — an interactive Kubernetes TUI manifest builder"
requires-python = ">=3.12"
readme = "README.md"
license = { file = "LICENSE" }
keywords = ["kubernetes", "k8s", "yaml", "tui", "terminal", "cli"]
dependencies = [
    "textual>=0.80.0",
    "pydantic>=2.0.0",
    "ruamel.yaml>=0.18.0",
    "PyYAML>=6.0.0",
]

[project.scripts]
ktui = "ktui.app:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pyinstaller>=6.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["ktui"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
