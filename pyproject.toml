[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ktui"
dynamic = ["version"]
description = "ktui — an interactive Kubernetes TUI manifest builder"
requires-python = ">=3.12"
readme = "README.md"
license = { file = "LICENSE" }
keywords = ["kubernetes", "k8s", "yaml", "tui", "terminal", "cli"]
dependencies = [
    "textual>=0.80.0",
    "pydantic>=2.0.0",
    "ruamel.yaml>=0.18.0",
]

[project.scripts]
ktui = "ktui.app:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pyinstaller>=6.0.0",
    "pytest-cov",
    "ruff",
    "mypy",
    "pre-commit",
    "pip-audit"
]

[tool.hatch.version]
path = "src/ktui/__init__.py"

[tool.hatch.envs.default.scripts]
build-bin = "pyinstaller ktui.spec --distpath dist --workpath build/pyinstaller --clean -y"

[tool.ruff]
line-length = 100
target-version = "py312"
ignore = ["BLE001", "S110", "RUF012", "PERF102"]

[tool.mypy]
check_untyped_defs = true
disallow_any_generics = false
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.hatch.build.targets.wheel]
packages = ["src/ktui"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
